# Apply after cordis.patch.yml. Model routes must already be configured in Harness.
- id: genesis
  config:
    leasePath: !!js dshHomePath('genesis.writer.lock')
    memory:
      decisionProvider: deepseek-official
      decisionModel: deepseek-v4-flash
      writerProvider: deepseek-official
      writerModel: deepseek-v4-flash
      embeddingUrl: !!js process.env.GENESIS_EMBEDDING_URL
      embeddingModel: !!js process.env.GENESIS_EMBEDDING_MODEL
      embeddingDimensions: !!js Number(process.env.GENESIS_EMBEDDING_DIMENSIONS)
      embeddingKeyEnv: GENESIS_EMBEDDING_API_KEY
