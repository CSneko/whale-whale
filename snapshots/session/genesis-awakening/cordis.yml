# Keyless headless replay uses the model script in this scenario's Session fixture.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeRuntimeContext: false
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: genesis
      name: '@deepseek-ai/dsh-experimental-genesis'
      config:
        leasePath: !!js dshHomePath('genesis.writer.lock')
        awakening: { provider: deepseek-official, model: deepseek-v4-flash }
        memory:
          decisionProvider: genesis-snapshot-reviewer
          decisionModel: no-update
          writerProvider: genesis-snapshot-reviewer
          writerModel: no-update
          embeddingUrl: http://127.0.0.1:1/embeddings
          embeddingModel: unused
          embeddingDimensions: 3
    - id: genesis-snapshot-setup
      name: '../../../packages/experimental/genesis/tests/snapshot-setup.ts'
